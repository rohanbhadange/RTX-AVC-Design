name: Refresh generated wiring diagrams

on:
  push:
    branches: [main]
    paths:
      - 'snapshots/wiring-studio/W-100_current.json'
      - 'snapshots/wiring-studio/W-101_current.json'
      - 'scripts/build_wiring_diagrams.py'
      - '.github/workflows/wiring-diagrams.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate diagrams and pin-level netlists
        run: python3 scripts/build_wiring_diagrams.py
      - name: Commit generated artifacts if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagrams/generated/
          if git diff --cached --quiet; then
            echo "Generated wiring outputs are already current."
          else
            git commit -m "docs(wiring): regenerate diagrams from current snapshots"
            git push origin HEAD:main
          fi
